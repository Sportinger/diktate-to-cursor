[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diktate-to-cursor"
version = "0.1.0"
description = "Deepgram-Diktat direkt am Cursor für GNOME und Wayland"
requires-python = ">=3.11"
dependencies = ["websockets>=15,<17", "httpx>=0.28,<1"]

[project.scripts]
diktate-to-cursor = "diktate.__main__:main"

[tool.setuptools.packages.find]
include = ["diktate*"]
